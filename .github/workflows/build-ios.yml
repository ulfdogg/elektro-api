name: Build iOS IPA

on:
  push:
    branches: [master]
    paths:
      - 'public/**'
      - 'android-app/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Capacitor dependencies
        working-directory: android-app
        run: npm ci

      - name: Prepare web assets (OFFLINE_APP=true)
        working-directory: android-app
        run: bash build-web.sh

      - name: Add iOS platform
        working-directory: android-app
        run: npx cap add ios

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: android-app/ios/App/Pods
          key: pods-${{ hashFiles('android-app/ios/App/Podfile.lock') }}
          restore-keys: pods-

      - name: Sync Capacitor iOS
        working-directory: android-app
        run: npx cap sync ios

      - name: Import signing certificate
        env:
          SIGNING_CERT_B64: ${{ secrets.APPLE_SIGNING_CERTIFICATE }}
          SIGNING_CERT_PWD: ${{ secrets.APPLE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          echo "$SIGNING_CERT_B64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "tmp-kc-pwd" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$SIGNING_CERT_PWD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | xargs)
          security default-keychain -s build.keychain
          security unlock-keychain -p "tmp-kc-pwd" build.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "tmp-kc-pwd" build.keychain
          rm /tmp/cert.p12

      - name: Import provisioning profile
        env:
          PROFILE_B64: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/elektrosim.mobileprovision

      - name: Set Team ID in ExportOptions
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          sed -i '' "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" android-app/ExportOptions.plist

      - name: Archive app
        working-directory: android-app/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath "$PWD/build/ElektroSim.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Automatic \
            -allowProvisioningUpdates \
            -quiet

      - name: Export IPA
        working-directory: android-app/ios/App
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath "$PWD/build/ElektroSim.xcarchive" \
            -exportPath "$PWD/build/ipa" \
            -exportOptionsPlist "../../ExportOptions.plist" \
            -quiet

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElektroSim-IPA
          path: android-app/ios/App/build/ipa/*.ipa
          retention-days: 30

      - name: Create Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android-app/ios/App/build/ipa/*.ipa
          name: "ElektroSim ${{ github.ref_name }}"
          body: |
            iOS IPA für ElektroSim – Elektroinstallations-Planer

            **Installation (Ad-hoc):**
            Gerät muss im Apple Developer Portal registriert sein.
            IPA über AltStore, Apple Configurator 2 oder Xcode installieren.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
