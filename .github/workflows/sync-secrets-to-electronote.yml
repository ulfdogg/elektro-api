name: Sync Secrets to ElectroNote

on:
  workflow_dispatch:
    inputs:
      pat:
        description: 'GitHub PAT'
        required: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Set secrets on ElectroNote
        env:
          GH_TOKEN: ${{ github.event.inputs.pat }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          gh secret set ASC_KEY_ID --repo ulfdogg/ElectroNote --body "$ASC_KEY_ID"
          gh secret set ASC_ISSUER_ID --repo ulfdogg/ElectroNote --body "$ASC_ISSUER_ID"
          gh secret set ASC_PRIVATE_KEY_BASE64 --repo ulfdogg/ElectroNote --body "$ASC_PRIVATE_KEY_BASE64"
          gh secret set IOS_CERTIFICATE_BASE64 --repo ulfdogg/ElectroNote --body "$IOS_CERTIFICATE_BASE64"
          gh secret set IOS_CERTIFICATE_PASSWORD --repo ulfdogg/ElectroNote --body "$IOS_CERTIFICATE_PASSWORD"
          echo "All secrets synced to ulfdogg/ElectroNote successfully!"
