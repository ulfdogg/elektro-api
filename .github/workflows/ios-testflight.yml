name: iOS TestFlight

on:
  push:
    branches: [master]
    paths:
      - 'public/**'
      - 'android-app/ios/**'
      - 'android-app/capacitor.config.json'
      - '.github/workflows/ios-testflight.yml'

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: android-app
        run: npm install

      - name: Build web assets
        working-directory: android-app
        run: bash build-web.sh

      - name: Add & sync Capacitor iOS
        working-directory: android-app
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Install CocoaPods
        working-directory: android-app/ios/App
        run: LANG=en_US.UTF-8 pod install

      - name: Import certificate & provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp /tmp/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/ff517007-42ce-44ed-b882-7d8ec833b142.mobileprovision

      - name: Build archive
        working-directory: android-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath /tmp/ElektroSim.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="iPhone Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="ff517007-42ce-44ed-b882-7d8ec833b142" \
            DEVELOPMENT_TEAM=PFPJHZQH4E \
            archive

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > /tmp/api_key.p8
          xcrun altool --upload-app \
            --type ios \
            --file /tmp/ElektroSim.xcarchive \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --private-key /tmp/api_key.p8
