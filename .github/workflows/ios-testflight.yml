name: iOS TestFlight

on:
  push:
    branches: [master]
    paths:
      - 'public/**'
      - 'android-app/capacitor.config.json'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:

jobs:
  build-and-upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: android-app
        run: npm install

      - name: Build web assets
        working-directory: android-app
        run: bash build-web.sh

      - name: Add & sync Capacitor iOS
        working-directory: android-app
        run: |
          npx cap add ios
          npx cap sync ios

      - name: Disable code signing for Pod library targets
        # Pods/Capacitor/CapacitorCordova are static libraries, not signed app bundles -- they
        # must never get a provisioning profile requirement. Without this, the manual signing
        # override in the archive step (needed for the App target) also applies to these Pod
        # targets and xcodebuild rejects the build ("does not support provisioning profiles").
        # CocoaPods only allows ONE post_install hook per Podfile, so this inserts into the
        # existing one (generated by Capacitor) instead of appending a second one.
        working-directory: android-app/ios/App
        run: |
          python3 - << 'PYEOF'
          import re
          with open('Podfile') as f:
              content = f.read()
          injection = (
              "\n"
              "  installer.pods_project.targets.each do |target|\n"
              "    target.build_configurations.each do |config|\n"
              "      config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'\n"
              "      config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'\n"
              "    end\n"
              "  end\n"
          )
          new_content, n = re.subn(r'(post_install do \|installer\|)', r'\1' + injection, content, count=1)
          if n == 0:
              raise SystemExit('Kein post_install-Hook im generierten Podfile gefunden')
          with open('Podfile', 'w') as f:
              f.write(new_content)
          PYEOF

      - name: Install CocoaPods
        working-directory: android-app/ios/App
        run: LANG=en_US.UTF-8 pod install

      - name: Import certificate & provisioning profile
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign
          security list-keychains -s build.keychain login.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/ff517007-42ce-44ed-b882-7d8ec833b142.mobileprovision

      - name: Setup ASC API Key
        env:
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          mkdir -p ~/.private_keys
          echo "$ASC_PRIVATE_KEY_BASE64" | base64 --decode > ~/.private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      - name: Build archive
        working-directory: android-app/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath /tmp/ElektroSim.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER=ff517007-42ce-44ed-b882-7d8ec833b142 \
            DEVELOPMENT_TEAM=PFPJHZQH4E \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export IPA
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > /tmp/ExportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>PFPJHZQH4E</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>de.elektrosimulator.app</key>
              <string>ff517007-42ce-44ed-b882-7d8ec833b142</string>
            </dict>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath /tmp/ElektroSim.xcarchive \
            -exportPath /tmp/ElektroSimExport \
            -exportOptionsPlist /tmp/ExportOptions.plist

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file /tmp/ElektroSimExport/App.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID" \
            --private-key ~/.private_keys/AuthKey_${ASC_KEY_ID}.p8
