<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stromlaufplan (aufgelöst)</title>
<script>
(function(){
  fetch('/api/me.php',{credentials:'include'}).then(r=>r.json()).then(d=>{
    if(!d.user){ location.href='/login.html'; }
  }).catch(()=>{ location.href='/login.html'; });
})();
</script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#e8edf2;color:#1f2937}
  #bar{background:#1a365d;color:#fff;padding:0 16px;height:48px;display:flex;align-items:center;gap:16px;
    box-shadow:0 2px 8px #0005;position:sticky;top:0;z-index:10}
  #bar a{color:#90cdf4;text-decoration:none;font-size:13px;white-space:nowrap}
  #bar a:hover{text-decoration:underline}
  #bar h1{font-size:14px;font-weight:600;white-space:nowrap}
  #bar .hint{font-size:11px;color:rgba(255,255,255,0.55);margin-left:auto;white-space:nowrap}
  #wrap{overflow:auto;width:100%;height:calc(100vh - 48px)}
  #empty{padding:60px 20px;text-align:center;color:#64748b;font-size:14px}
  .rail-label{font-size:11px;fill:#374151;font-weight:700}
</style>
</head>
<body>
<div id="bar">
  <a href="/">← Zurück zum Aufbauplan</a>
  <h1>⚡ Stromlaufplan — aufgelöste Darstellung</h1>
  <span class="hint">automatisch erzeugt · schreibgeschützt</span>
</div>
<div id="wrap"><div id="empty" style="display:none">Kein Aufbau gefunden. Öffne zuerst den Aufbauplan und baue eine Schaltung.</div><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){
  const el=document.createElementNS(NS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}

// Nicht-elektrische/strukturelle Bauteile (haben keine Ports) werden ausgeblendet
const SKIP_TYPES = new Set(['uv','uv2','uv3','hutschiene','aufputzgehaeuse1','aufputzgehaeuse2','aufputzgehaeuse3','kabelkanal','cee16_kupplung']);

// Grobe Bänder, nur um Kreuzungen zu reduzieren — kein separates Diagramm
const BAND = {
  cee16_dose:0, cee16_kupplung:0, ls1:0, ls3:0, rcd2:0, rcd4:0, rcbo:0,
  lampe:2, spot:2, motor:2, motorklemmbrett:2, dahlander:2, steckdose:2,
};
function bandOf(type){ return BAND[type]!=null ? BAND[type] : 1; }

// Aderfarbe → Sammelschiene
const RAIL_BY_COLOR = {
  '#8B4513':'L1', '#222':'L2', '#111':'L2', '#6b7280':'L3',
  '#1a56db':'N', '#16a34a':'PE',
};
const TOP_RAILS = ['L1','L2','L3'];
const BOT_RAILS = ['N','PE'];

// Bauteiltyp → vereinfachtes Schaltzeichen (statt generischer Box)
function symbolFor(type) {
  if (['schalter','taster','wechsel','kreuzschalter','kontakt_no','kontakt_led','drucktaster'].includes(type)) return 'contact_no';
  if (type==='kontakt_nc') return 'contact_nc';
  if (type==='ls1') return 'breaker';
  if (type==='lampe' || type==='spot') return 'lamp';
  if (type==='motor' || type==='dahlander') return 'motor';
  if (type==='steckdose') return 'socket';
  if (['nblock','peblock','klemme','klemme25','klemme25_twin','knotenpunkt','wago2','wago3','wago5'].includes(type)) return 'terminal';
  return null;
}
function drawSymbol(svg, sym, x, y, w, h, label) {
  const cx=x+w/2, cy=y+h/2;
  mk('text',{x:cx, y:y-8, 'text-anchor':'middle', 'font-size':9, fill:'#1f2937', 'font-weight':'bold'},svg).textContent=label;
  const stroke = '#1f2937';
  switch(sym){
    case 'contact_no':
    case 'contact_nc': {
      const p1x=x+13, p2x=x+w-13;
      mk('line',{x1:p1x,y1:y,x2:p1x,y2:cy,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:p2x,y1:cy,x2:p2x,y2:y+h,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:p1x,y1:cy,x2:p2x-4,y2:cy-14,stroke,'stroke-width':1.8,'stroke-linecap':'round'},svg);
      mk('circle',{cx:p1x,cy,r:1.8,fill:stroke},svg);
      mk('circle',{cx:p2x,cy,r:1.8,fill:stroke},svg);
      if (sym==='contact_nc') {
        mk('line',{x1:p2x-9,y1:cy-19,x2:p2x-1,y2:cy-9,stroke,'stroke-width':1.5},svg);
      }
      break;
    }
    case 'breaker': {
      const px=cx;
      mk('line',{x1:px,y1:y,x2:px,y2:cy-4,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:px,y1:cy+12,x2:px,y2:y+h,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:px,y1:cy-4,x2:px+12,y2:cy+8,stroke,'stroke-width':1.8,'stroke-linecap':'round'},svg);
      mk('rect',{x:px+7,y:cy-3,width:9,height:9,fill:'#fff',stroke,'stroke-width':1.3},svg);
      break;
    }
    case 'lamp': {
      mk('circle',{cx,cy,r:13,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('line',{x1:cx-8,y1:cy-8,x2:cx+8,y2:cy+8,stroke,'stroke-width':1.2},svg);
      mk('line',{x1:cx-8,y1:cy+8,x2:cx+8,y2:cy-8,stroke,'stroke-width':1.2},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-13,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:cx,y1:cy+13,x2:cx,y2:y+h,stroke,'stroke-width':1.5},svg);
      break;
    }
    case 'motor': {
      mk('circle',{cx,cy,r:15,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':11,fill:stroke,'font-weight':'bold'},svg).textContent='M';
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-15,stroke,'stroke-width':1.5},svg);
      break;
    }
    case 'socket': {
      mk('circle',{cx,cy,r:13,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('circle',{cx:cx-4,cy,r:1.6,fill:stroke},svg);
      mk('circle',{cx:cx+4,cy,r:1.6,fill:stroke},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-13,stroke,'stroke-width':1.5},svg);
      break;
    }
    case 'terminal': {
      mk('circle',{cx,cy,r:4,fill:stroke},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy,stroke,'stroke-width':1.5},svg);
      break;
    }
  }
}

let comps = [], wires = [];

function loadAndRender(){
  let data = {comps:[], wires:[]};
  try {
    const raw = localStorage.getItem('elektroplan_v1');
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  comps = (data.comps||[]).filter(c=>!SKIP_TYPES.has(c.type));
  wires = data.wires||[];

  const svgEl = document.getElementById('svg');
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  if (!comps.length) {
    document.getElementById('empty').style.display='';
  } else {
    document.getElementById('empty').style.display='none';
    render();
  }
}
loadAndRender();
window.addEventListener('storage', e=>{ if (e.key==='elektroplan_v1') loadAndRender(); });
let _lastRaw = localStorage.getItem('elektroplan_v1');
setInterval(()=>{
  const cur = localStorage.getItem('elektroplan_v1');
  if (cur !== _lastRaw) { _lastRaw = cur; loadAndRender(); }
}, 1500);

function render(){
  // Benutzte Ports pro Bauteil aus den Adern ermitteln
  const usedPorts = {};
  wires.forEach(w=>{
    (usedPorts[w.fid]||(usedPorts[w.fid]=new Set())).add(w.fp);
    (usedPorts[w.tid]||(usedPorts[w.tid]=new Set())).add(w.tp);
  });

  const BOXH=52, PORTGAP=26, BOXMINW=76, HGAP=34, MARGIN=50;
  const TOPRAIL_GAP=20, BANDH=110, RAILSPACE=90;

  // Bauteile links→rechts wie im Aufbauplan (Original-x), in Bänder gestaffelt
  const items = comps.slice().sort((a,b)=>a.x-b.x);
  const bandItems = [[],[],[]];
  items.forEach(c=>bandItems[bandOf(c.type)].push(c));

  const boxes = []; // {c,x,y,w,h,ports}
  const portPos = {}; // "compId:portIdx" -> {x,y}
  let maxRowW = 0;

  const topRailsH = MARGIN + (TOP_RAILS.length-1)*TOPRAIL_GAP + 10;
  bandItems.forEach((list, bi) => {
    let x = MARGIN;
    const y = topRailsH + RAILSPACE + bi*BANDH;
    list.forEach(c=>{
      const ports = [...(usedPorts[c.id]||[])].sort((a,b)=>a-b);
      const w = Math.max(BOXMINW, ports.length*PORTGAP + 14);
      boxes.push({c,x,y,w,h:BOXH,ports});
      ports.forEach((pi,i)=>{
        const px = x + 10 + i*PORTGAP + PORTGAP/2 - 13;
        portPos[c.id+':'+pi] = {x:px, y, band:bi};
      });
      x += w + HGAP;
    });
    if (x > maxRowW) maxRowW = x;
  });

  const totalW = Math.max(700, maxRowW + MARGIN);
  const botRailsY = topRailsH + RAILSPACE + 3*BANDH + 20;
  const totalH = botRailsY + (BOT_RAILS.length-1)*TOPRAIL_GAP + 40;

  const svg = document.getElementById('svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  // Sammelschienen zeichnen
  const railY = {};
  TOP_RAILS.forEach((r,i)=>{ railY[r] = MARGIN + i*TOPRAIL_GAP; });
  BOT_RAILS.forEach((r,i)=>{ railY[r] = botRailsY + i*TOPRAIL_GAP; });
  [...TOP_RAILS, ...BOT_RAILS].forEach(r=>{
    const y = railY[r];
    const col = r==='L1'?'#8B4513':r==='L2'?'#222':r==='L3'?'#6b7280':r==='N'?'#1a56db':'#16a34a';
    mk('line',{x1:MARGIN-10,y1:y,x2:totalW-MARGIN+10,y2:y,stroke:col,'stroke-width':2.5},svg);
    mk('text',{x:14,y:y+4,class:'rail-label',fill:col},svg).textContent=r;
  });

  // Ports, die bereits an eine Sammelschiene gestubbt wurden (keine Duplikate)
  const stubbed = new Set();
  const usedRailStub = key=>{ if(stubbed.has(key)) return true; stubbed.add(key); return false; };

  // Verbindungen zeichnen: Aderfarbe passend zu einer Schiene → Stub zur Schiene; sonst Punkt-zu-Punkt
  wires.forEach(w=>{
    const rail = RAIL_BY_COLOR[w.color];
    if (rail) {
      // Beide Enden unabhängig behandeln — eines kann z.B. die (nicht gezeichnete) CEE-Kupplung sein
      [[w.fid,w.fp],[w.tid,w.tp]].forEach(([cid,pi])=>{
        const p = portPos[cid+':'+pi];
        if (!p) return;
        const key = cid+':'+pi+':'+rail;
        if (usedRailStub(key)) return;
        mk('line',{x1:p.x,y1:p.y,x2:p.x,y2:railY[rail],stroke:w.color,'stroke-width':1.8,opacity:0.85},svg);
        mk('circle',{cx:p.x,cy:railY[rail],r:2.5,fill:w.color},svg);
      });
      return;
    }
    const a = portPos[w.fid+':'+w.fp], b = portPos[w.tid+':'+w.tp];
    if (!a || !b) return;
    {
      const midY = (a.y+b.y)/2;
      const d = `M${a.x},${a.y} L${a.x},${midY} L${b.x},${midY} L${b.x},${b.y}`;
      mk('path',{d,fill:'none',stroke:w.color||'#6b7280','stroke-width':1.8,opacity:0.85},svg);
      if (w.label) {
        const mx=(a.x+b.x)/2;
        mk('rect',{x:mx-14,y:midY-8,width:28,height:11,fill:'#fff',opacity:0.85,rx:2},svg);
        mk('text',{x:mx,y:midY+1,'text-anchor':'middle','font-size':8,fill:'#374151','font-weight':'bold'},svg).textContent=w.label;
      }
    }
  });

  // Boxen / Schaltzeichen zeichnen
  boxes.forEach(({c,x,y,w,h,ports})=>{
    const connected = ports.length>0;
    const sym = symbolFor(c.type);
    if (sym) {
      drawSymbol(svg, sym, x, y, w, h, c.label || c.type);
    } else {
      mk('rect',{x,y,width:w,height:h,rx:4,fill:connected?'#fff':'#f1f5f9',
        stroke:connected?'#334155':'#cbd5e1','stroke-width':1.5},svg);
      mk('text',{x:x+w/2,y:y+16,'text-anchor':'middle','font-size':10,fill:'#1f2937','font-weight':'bold'},svg)
        .textContent = c.label || c.type;
    }
    mk('text',{x:x+w/2,y:y+h+14,'text-anchor':'middle','font-size':8,fill:'#94a3b8'},svg)
      .textContent = '#'+c.id;
    ports.forEach((pi,i)=>{
      const px = x+10+i*PORTGAP+PORTGAP/2-13, py=y;
      mk('circle',{cx:px,cy:py,r:3.5,fill:'#fff',stroke:'#374151','stroke-width':1.5},svg);
      mk('text',{x:px,y:py-6,'text-anchor':'middle','font-size':7,fill:'#64748b'},svg).textContent=pi;
    });
    if (!connected) {
      mk('text',{x:x+w/2,y:y+h/2+4,'text-anchor':'middle','font-size':7,fill:'#94a3b8'},svg).textContent='(nicht verdrahtet)';
    }
  });
}
</script>
</body>
</html>
