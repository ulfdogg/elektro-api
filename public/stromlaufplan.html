<script>
'use strict';
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){
  const el=document.createElementNS(NS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}

// ── Symbolbibliothek (IEC 60617 / DIN EN 60617 angelehnt) ──────────────────────
// Jedes Symbol: w,h (Bounding-Box), ports:[{x,y,label}] (Anschlusspunkte, oben=Versorgung
// Richtung), draw(g, stroke) zeichnet das reine Symbol bei (0,0) — wird per <g transform>
// an die Instanzposition verschoben.
function line(g,x1,y1,x2,y2,s,w){ mk('line',{x1,y1,x2,y2,stroke:s||'#1f2937','stroke-width':w||1.6,'stroke-linecap':'round'},g); }
function dot(g,x,y,s){ mk('circle',{cx:x,cy:y,r:2.2,fill:s||'#1f2937'},g); }

// Kontaktzunge beginnt/endet IMMER genau an einem der beiden Anschlusspunkte (t1 oben,
// t2 unten) — vorher endete sie frei im Raum, dadurch wirkte das Symbol "nicht verbunden".
// Schließer (NO): Zunge endet knapp VOR dem oberen Anschluss = offen (Grundstellung).
// Öffner (NC): Zunge erreicht den oberen Anschluss = geschlossen (Grundstellung), plus
// kurzer Querstrich als Öffner-Kennzeichen (öffnet erst bei Betätigung).
// actuator: null (automatisch betätigt, z.B. Relais-/Schützkontakt — keine Kennzeichnung),
// 'taster' (Drucktaster: Stößel mit Knopf, kehrt nach Loslassen zurück) oder
// 'schalter' (Raststellung: schräger Handgriff, bleibt in der Stellung stehen).
// closedNow: undefined/null = Ruhezustand zeigen (NO=offen, NC=geschlossen, wie in der
// Palette). true/false = tatsächlicher Zustand während der Simulation — die Kontaktzunge
// bewegt sich dann wirklich sichtbar zwischen offen und geschlossen.
function contactGlyph(g, nc, actuator, cx, closedNow){
  cx = cx===undefined?14:cx;
  const t1=16, t2=28;
  line(g,cx,0,cx,t1);
  line(g,cx,t2,cx,44);
  dot(g,cx,t1); dot(g,cx,t2);
  const closed = closedNow==null ? nc : closedNow;
  const bladeCol = closedNow==null ? '#1f2937' : (closed?'#16a34a':'#1f2937');
  // Geschlossen: Zunge trifft den Anschlusspunkt exakt (glatte Verbindung, kein
  // seitlicher Versatz mehr) — offen: sichtbar daneben, erreicht ihn nicht.
  if (closed) line(g,cx,t2,cx,t1,bladeCol,1.8);
  else line(g,cx,t2,cx+6,t1+3,bladeCol,1.8);
  if (nc) line(g,cx+1,t1-1,cx+7,t1-7,'#1f2937',1.3); // Öffner-Kennzeichen (Bauart, immer sichtbar)
  if (actuator==='taster') {
    // Drucktaster: senkrechter Stößel mit Knopf, drückt von oben auf die Kontaktzunge
    line(g,cx,t1-3,cx,t1-13,'#1f2937',1.4);
    mk('circle',{cx,cy:t1-16,r:3,fill:'#fff',stroke:'#1f2937','stroke-width':1.3},g);
  } else if (actuator==='schalter') {
    // Schalter (Raststellung): schräger Handgriff am oberen Anschluss
    line(g,cx,t1-1,cx+9,t1-11,'#1f2937',1.6);
    line(g,cx+7,t1-11,cx+11,t1-9,'#1f2937',1.6);
  }
}
function coilGlyph(g, delay){
  const cx=17,w=28,h=20,top=8,bot=36;
  line(g,cx,0,cx,top);
  line(g,cx,bot,cx,44);
  mk('rect',{x:cx-w/2,y:top,width:w,height:h,fill:'#fff',stroke:'#1f2937','stroke-width':1.6},g);
  if (delay) {
    // Zeitverzögerungs-Symbol: kleiner Bogen im Spulenkasten
    mk('path',{d:`M${cx-7},${top+14} q7,6 14,0`,fill:'none',stroke:'#1f2937','stroke-width':1.3},g);
  }
}
// Trenner-/Leistungsschalter-Polzunge — gleiche Logik wie contactGlyph (immer an den
// Anschlusspunkten verankert), nur etwas kürzerer Abstand für die Reihenanordnung mehrpoliger
// Schalter.
function breakerPole(g, ox, closedNow){
  const cx=ox+11, t1=14, t2=28;
  line(g,cx,0,cx,t1);
  line(g,cx,t2,cx,40);
  dot(g,cx,t1); dot(g,cx,t2);
  const closed = closedNow==null ? true : closedNow; // Ruhezustand: eingeschaltet/geschlossen
  const bladeCol = closedNow==null ? '#1f2937' : (closed?'#16a34a':'#1f2937');
  if (closed) line(g,cx,t2,cx,t1,bladeCol,1.8);
  else line(g,cx,t2,cx+6,t1+3,bladeCol,1.8);
}
function rcdMark(g,cx){
  // Kreis um die Polzungen als generisches Sinnbild für die Summenstromwandler-Auslösung
  // (FI/RCD) — bewusst ohne Zusatzsymbol, um nichts zu behaupten, das nicht sicher
  // normgerecht ist. Innerhalb der normalen Symbolhöhe platziert (nicht darüber), damit es
  // in der kleinen Palettenvorschau nicht abgeschnitten wird.
  mk('circle',{cx,cy:20,r:9,fill:'none',stroke:'#1f2937','stroke-width':1.1,'stroke-dasharray':'2,1.5'},g);
}

// Liefert den Ist-Zustand (offen/geschlossen) für ein Bauteil während der Simulation,
// oder null außerhalb der Simulation (dann zeigt das Symbol seinen Ruhezustand, z.B. in
// der Palettenvorschau).
function simClosed(inst){ return (simMode && inst) ? isInstActive(inst) : null; }

const SYM = {
  contact_no:{cat:'Kontakte',label:'Schließer (NO)',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>contactGlyph(g,false,null,14,simClosed(inst))},
  contact_nc:{cat:'Kontakte',label:'Öffner (NC)',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>contactGlyph(g,true,null,14,simClosed(inst))},
  contact_co:{cat:'Kontakte',label:'Wechsler',w:38,h:44,ports:[{x:14,y:0,l:'C'},{x:14,y:44,l:'NO'},{x:32,y:44,l:'NC'}],
    draw:(g,inst)=>{
      const cx=14,t1=16,t2=28;
      const on = simMode && inst ? coilOnForLabel(inst.label) : false; // Ruhezustand = NC verbunden
      line(g,cx,0,cx,t1); dot(g,cx,t1);
      line(g,cx,t2,cx,44); dot(g,cx,t2);
      line(g,32,20,32,44); dot(g,32,20);
      const col = simMode && inst ? '#16a34a' : '#1f2937';
      if (on) line(g,cx,t1,cx,t2,col,1.8); else line(g,cx,t1,32,20,col,1.8);
    }},
  taster_no:{cat:'Taster/Schalter',label:'Taster Schließer',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>contactGlyph(g,false,'taster',14,simClosed(inst))},
  taster_nc:{cat:'Taster/Schalter',label:'Taster Öffner',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>contactGlyph(g,true,'taster',14,simClosed(inst))},
  schalter:{cat:'Taster/Schalter',label:'Schalter',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>contactGlyph(g,false,'schalter',14,simClosed(inst))},
  wechselschalter:{cat:'Taster/Schalter',label:'Wechselschalter',w:38,h:44,
    ports:[{x:14,y:0,l:'C'},{x:14,y:44,l:'1'},{x:32,y:44,l:'2'}],
    draw:(g,inst)=>{
      const cx=14,t1=16,t2=28;
      const s = (simMode && inst) ? (simState[inst.id]||{}) : {};
      const pos2 = (simMode && inst) ? s.pos===2 : false; // Ruhezustand = Stellung 1
      line(g,cx,0,cx,t1); dot(g,cx,t1);
      line(g,cx,t2,cx,44); dot(g,cx,t2);
      line(g,32,20,32,44); dot(g,32,20);
      const col = simMode && inst ? '#16a34a' : '#1f2937';
      if (pos2) line(g,cx,t1,32,20,col,1.8); else line(g,cx,t1,cx,t2,col,1.8);
      // Handgriff = manuelle Betätigung (unterscheidet ihn vom automatischen Wechsler-Kontakt)
      line(g,cx,t1-1,cx+7,t1-10,'#1f2937',1.6);
    }},
  kreuzschalter:{cat:'Taster/Schalter',label:'Kreuzschalter',w:36,h:44,
    ports:[{x:9,y:0,l:'1'},{x:27,y:0,l:'2'},{x:9,y:44,l:'3'},{x:27,y:44,l:'4'}],
    draw:(g,inst)=>{
      const s = (simMode && inst) ? (simState[inst.id]||{}) : {};
      const crossed = !!s.crossed;
      line(g,9,0,9,14); line(g,27,0,27,14);
      line(g,9,30,9,44); line(g,27,30,27,44);
      dot(g,9,14); dot(g,27,14); dot(g,9,30); dot(g,27,30);
      const col = simMode && inst ? '#16a34a' : '#1f2937';
      if (!crossed) { line(g,9,14,9,30,col,1.6); line(g,27,14,27,30,col,1.6); }
      else { line(g,9,14,27,30,col,1.6); line(g,27,14,9,30,col,1.6); }
      // Handgriff = manuelle Betätigung
      line(g,18,14,18,4,'#1f2937',1.6); line(g,14,4,22,4,'#1f2937',1.6);
    }},
  notaus:{cat:'Taster/Schalter',label:'Not-Aus',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>{ contactGlyph(g,true,'taster',14,simClosed(inst)); mk('circle',{cx:23,cy:-2,r:4,fill:'none',stroke:'#dc2626','stroke-width':1.6},g); }},
  coil:{cat:'Spulen',label:'Schütz-/Relaisspule',w:34,h:44,ports:[{x:17,y:0,l:'A1'},{x:17,y:44,l:'A2'}],
    draw:g=>coilGlyph(g,false)},
  coil_delay:{cat:'Spulen',label:'Zeitrelais-Spule',w:34,h:44,ports:[{x:17,y:0,l:'A1'},{x:17,y:44,l:'A2'}],
    draw:g=>coilGlyph(g,true)},
  ls1:{cat:'Schutzorgane',label:'LS 1-polig',w:22,h:40,ports:[{x:11,y:0},{x:11,y:40}],
    draw:(g,inst)=>breakerPole(g,0,simClosed(inst))},
  ls3:{cat:'Schutzorgane',label:'LS 3-polig',w:66,h:40,ports:[{x:11,y:0},{x:33,y:0},{x:55,y:0},{x:11,y:40},{x:33,y:40},{x:55,y:40}],
    draw:(g,inst)=>{ const c=simClosed(inst); breakerPole(g,0,c); breakerPole(g,22,c); breakerPole(g,44,c); }},
  rcd2:{cat:'Schutzorgane',label:'FI/RCD 2-polig',w:44,h:40,ports:[{x:11,y:0},{x:33,y:0},{x:11,y:40},{x:33,y:40}],
    draw:(g,inst)=>{ const c=simClosed(inst); breakerPole(g,0,c); breakerPole(g,22,c); rcdMark(g,22); }},
  rcd4:{cat:'Schutzorgane',label:'FI/RCD 4-polig',w:88,h:40,ports:[{x:11,y:0},{x:33,y:0},{x:55,y:0},{x:77,y:0},{x:11,y:40},{x:33,y:40},{x:55,y:40},{x:77,y:40}],
    draw:(g,inst)=>{ const c=simClosed(inst); [0,22,44,66].forEach(o=>breakerPole(g,o,c)); rcdMark(g,44); }},
  rcbo:{cat:'Schutzorgane',label:'RCBO (LS+FI)',w:44,h:40,ports:[{x:11,y:0},{x:33,y:0},{x:11,y:40},{x:33,y:40}],
    draw:(g,inst)=>{ const c=simClosed(inst); breakerPole(g,0,c); breakerPole(g,22,c); rcdMark(g,22); mk('text',{x:22,y:52,'text-anchor':'middle','font-size':7,fill:'#1f2937'},g).textContent='B16'; }},
  lampe:{cat:'Verbraucher',label:'Lampe/Leuchte',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>{ const on=simMode&&inst&&isInstActive(inst);
      line(g,14,0,14,9); line(g,14,35,14,44);
      if(on) mk('circle',{cx:14,cy:22,r:18,fill:'#fde047',opacity:0.55},g); // Glüheffekt
      mk('circle',{cx:14,cy:22,r:13,fill:on?'#fef08a':'#fff',stroke:'#1f2937','stroke-width':1.6},g);
      line(g,6,14,22,30); line(g,6,30,22,14); }},
  motor:{cat:'Verbraucher',label:'Motor 3~ (6 Klemmen)',w:70,h:60,
    ports:[{x:15,y:0,l:'U1'},{x:35,y:0,l:'V1'},{x:55,y:0,l:'W1'},
           {x:15,y:60,l:'U2'},{x:35,y:60,l:'V2'},{x:55,y:60,l:'W2'},
           {x:70,y:30,l:'PE'}],
    draw:(g,inst)=>{
      const cx=35,cy=30,r=20;
      const running = simMode && inst && isInstActive(inst);
      [15,35,55].forEach(x=>{ line(g,x,0,x,cy-r); line(g,x,cy+r,x,60); });
      if (running) mk('circle',{cx,cy,r:r+5,fill:'none',stroke:'#22c55e','stroke-width':2,opacity:0.5},g);
      mk('circle',{cx,cy,r,fill:running?'#dcfce7':'#fff',stroke:'#1f2937','stroke-width':1.6},g);
      mk('text',{x:cx,y:cy+5,'text-anchor':'middle','font-size':15,fill:'#1f2937','font-weight':'bold'},g).textContent='M';
      mk('text',{x:cx,y:cy+15,'text-anchor':'middle','font-size':7,fill:'#1f2937'},g).textContent='3~';
      // PE seitlich (Schutzerde-Symbol, siehe SYM.pe)
      line(g,cx+r,cy,70,cy);
      line(g,64,cy-6,64,cy+6); line(g,67,cy-4,67,cy+4); line(g,70,cy-2,70,cy+2);
      ['U1','V1','W1'].forEach((l,i)=>mk('text',{x:15+i*20,y:-4,'text-anchor':'middle','font-size':7,fill:'#6b7280'},g).textContent=l);
      ['U2','V2','W2'].forEach((l,i)=>mk('text',{x:15+i*20,y:70,'text-anchor':'middle','font-size':7,fill:'#6b7280'},g).textContent=l);
    }},
  motor1:{cat:'Verbraucher',label:'Motor 1~',w:34,h:44,ports:[{x:17,y:0},{x:17,y:44}],
    draw:(g,inst)=>{ const running=simMode&&inst&&isInstActive(inst);
      line(g,17,0,17,9); line(g,17,35,17,44);
      if (running) mk('circle',{cx:17,cy:22,r:20,fill:'none',stroke:'#22c55e','stroke-width':2,opacity:0.5},g);
      mk('circle',{cx:17,cy:22,r:15,fill:running?'#dcfce7':'#fff',stroke:'#1f2937','stroke-width':1.6},g);
      mk('text',{x:17,y:26,'text-anchor':'middle','font-size':13,fill:'#1f2937','font-weight':'bold'},g).textContent='M';
      mk('text',{x:17,y:35,'text-anchor':'middle','font-size':7,fill:'#1f2937'},g).textContent='1~'; }},
  steckdose:{cat:'Verbraucher',label:'Steckdose',w:28,h:44,ports:[{x:14,y:0},{x:14,y:44}],
    draw:(g,inst)=>{ const on=simMode&&inst&&isInstActive(inst);
      line(g,14,0,14,9); line(g,14,35,14,44);
      mk('circle',{cx:14,cy:22,r:13,fill:on?'#dcfce7':'#fff',stroke:on?'#16a34a':'#1f2937','stroke-width':1.6},g);
      dot(g,10,22); dot(g,18,22); }},
  motion:{cat:'Verbraucher',label:'Bewegungsmelder',w:30,h:50,ports:[{x:15,y:6},{x:15,y:50}],
    draw:g=>{ contactGlyph(g,false,false); mk('path',{d:'M4,15 Q15,4 26,15',fill:'none',stroke:'#1f2937','stroke-width':1.3},g); }},
  block:{cat:'Geräte',label:'Gerät (SPS/FU/Netzteil …)',w:70,h:50,
    ports:[{x:10,y:0},{x:35,y:0},{x:60,y:0},{x:10,y:50},{x:35,y:50},{x:60,y:50}],
    draw:g=>{ mk('rect',{x:0,y:0,width:70,height:50,fill:'#fff',stroke:'#1f2937','stroke-width':1.6},g);
      [10,35,60].forEach(x=>{ line(g,x,-6,x,0); line(g,x,50,x,56); }); }},
  gleichrichter:{cat:'Geräte',label:'Gleichrichter',w:40,h:40,ports:[{x:20,y:0},{x:0,y:20},{x:20,y:40},{x:40,y:20}],
    draw:g=>{ mk('circle',{cx:20,cy:20,r:19,fill:'#fff',stroke:'#1f2937','stroke-width':1.6},g);
      line(g,8,8,32,32); line(g,8,32,32,8);
      mk('polygon',{points:'12,12 12,28 26,20',fill:'#1f2937'},g); }},
  junction:{cat:'Verbindungen',label:'Verbindungspunkt',w:10,h:10,ports:[{x:5,y:5}],
    draw:g=>{ dot(g,5,5,'#1f2937'); }},
  pe:{cat:'Verbindungen',label:'Schutzerde (PE)',w:20,h:26,ports:[{x:10,y:0}],
    draw:g=>{ line(g,10,0,10,14); line(g,2,14,18,14); line(g,5,18,15,18); line(g,8,22,12,22); }},
};
const CATS = ['Schutzorgane','Kontakte','Taster/Schalter','Spulen','Verbraucher','Geräte','Verbindungen'];

// Spannungsversorgung: durchgehende Sammelschienen (L1/L2/L3/N/PE) über das ganze Blatt,
// an die Bauteile an JEDER Stelle entlang der Linie andocken können (wie in einem echten
// Stromlaufplan üblich) — kein einzelnes Bauteil mit festen Ports.
const RAIL_TYPES = {
  L1:{color:'#8B4513',label:'L1'}, L2:{color:'#1f2937',label:'L2'}, L3:{color:'#6b7280',label:'L3'},
  N:{color:'#1a56db',label:'N'}, PE:{color:'#16a34a',label:'PE'},
};

// ── State ────────────────────────────────────────────────────────────────────
let insts = [], wires = [], iid=1, wid=1;
let rails = [], railConns = [], rid=1, rcid=1;
let sel = null, selWire = null, selRail = null, selRailConn = null;
let zoom = 1, panX=80, panY=40;
let wireStart = null; // {instId, portIdx}

// ── Simulation ───────────────────────────────────────────────────────────────
// Anders als im Aufbauplan sind Spule und zugehörige Kontakte hier UNABHÄNGIGE Symbole,
// die nur über eine identische Beschriftung (z.B. "K1") zusammengehören — das ist die
// reale Konvention in einem Stromlaufplan. Die Engine gruppiert also über Labels statt
// über feste Bauteil-Ports.
const POT = { L1:4, L2:8, L3:16, N:2, PE:1 };
const ANY_L = POT.L1|POT.L2|POT.L3;
const POLE_PAIRS = { ls1:[[0,1]], ls3:[[0,3],[1,4],[2,5]], rcd2:[[0,2],[1,3]], rcd4:[[0,4],[1,5],[2,6],[3,7]], rcbo:[[0,1],[2,3]] };

let simMode = false, simState = {};
let simPortPot = {}, simPortNode = {};

function normLabel(l){ return (l||'').trim().toLowerCase(); }
function coilOnForLabel(label){
  const nl = normLabel(label);
  if (!nl) return false;
  const coil = insts.find(i=>(i.type==='coil'||i.type==='coil_delay') && normLabel(i.label)===nl);
  return coil ? !!(simState[coil.id]||{}).on : false;
}

function initSimState(){
  simState = {};
  insts.forEach(inst=>{
    const d = {};
    switch(inst.type){
      case 'taster_no': case 'taster_nc': d.pressed=false; break;
      case 'schalter': d.closed=true; break;
      case 'wechselschalter': d.pos=1; break;
      case 'kreuzschalter': d.crossed=false; break;
      case 'notaus': d.latched=false; break;
      case 'ls1': case 'ls3': case 'rcbo': d.on=true; break;
      case 'rcd2': case 'rcd4': d.on=true; d.tripped=false; break;
    }
    simState[inst.id] = d;
  });
}

// Eine Simulationsrunde: Potentiale über Union-Find ausbreiten (Schienen = Quellen,
// geschlossene Kontakte/Schalter verbinden), Spulen-Zustand daraus ableiten. Da ein
// Kontakt vom Zustand SEINER Spule abhängt (und der wiederum vom Potential, das durch
// andere Kontakte fließt), wird iteriert bis sich nichts mehr ändert — wie im Aufbauplan.
function computeSimOnce(){
  const idx = {}; let k=0;
  insts.forEach(inst=>{ SYM[inst.type].ports.forEach((p,pi)=>{ idx[inst.id+':'+pi]=k++; }); });
  rails.forEach(r=>{ idx['rail:'+r.id]=k++; });
  const parent = new Int32Array(k); for(let i=0;i<k;i++) parent[i]=i;
  const find = x=>{ while(parent[x]!==x){ parent[x]=parent[parent[x]]; x=parent[x]; } return x; };
  const union = (a,b)=>{ if(a==null||b==null) return; a=find(a); b=find(b); if(a!==b) parent[b]=a; };

  wires.forEach(w=> union(idx[w.fid+':'+w.fp], idx[w.tid+':'+w.tp]));
  railConns.forEach(rc=> union(idx[rc.fid+':'+rc.fp], idx['rail:'+rc.rail]));

  insts.forEach(inst=>{
    const s = simState[inst.id]||{};
    const P = pi=>idx[inst.id+':'+pi];
    switch(inst.type){
      case 'contact_no': if (coilOnForLabel(inst.label)) union(P(0),P(1)); break;
      case 'contact_nc': if (!coilOnForLabel(inst.label)) union(P(0),P(1)); break;
      case 'contact_co': { const on=coilOnForLabel(inst.label); if(on) union(P(0),P(1)); else union(P(0),P(2)); break; }
      case 'taster_no': if (s.pressed) union(P(0),P(1)); break;
      case 'taster_nc': if (!s.pressed) union(P(0),P(1)); break;
      case 'schalter': if (s.closed!==false) union(P(0),P(1)); break;
      case 'wechselschalter': union(P(0), P(s.pos===2?2:1)); break;
      case 'kreuzschalter':
        if (!s.crossed) { union(P(0),P(2)); union(P(1),P(3)); }
        else { union(P(0),P(3)); union(P(1),P(2)); }
        break;
      case 'notaus': if (!s.latched) union(P(0),P(1)); break;
      case 'ls1': case 'ls3': case 'rcbo':
        if (s.on!==false && !s.tripped) (POLE_PAIRS[inst.type]||[]).forEach(([a,b])=>union(P(a),P(b)));
        break;
      case 'rcd2': case 'rcd4':
        if (s.on!==false && !s.tripped) (POLE_PAIRS[inst.type]||[]).forEach(([a,b])=>union(P(a),P(b)));
        break;
    }
  });

  const pot = new Int32Array(k);
  rails.forEach(r=>{ const n=find(idx['rail:'+r.id]); pot[n] |= POT[r.type]; });

  const gp = (id,pi)=>{ const p=idx[id+':'+pi]; return p!=null?pot[find(p)]:0; };
  return { idx, find, pot, gp };
}

function runSim(depth){
  depth = depth||0;
  const { idx, find, pot, gp } = computeSimOnce();

  let changed = false;
  insts.forEach(inst=>{
    if (inst.type!=='coil' && inst.type!=='coil_delay') return;
    const p0=gp(inst.id,0), p1=gp(inst.id,1);
    const on = !!((p0&ANY_L)&&(p1&POT.N) || (p1&ANY_L)&&(p0&POT.N));
    const s = simState[inst.id]||{};
    if (!!s.on !== on) { simState[inst.id]={...s, on}; changed=true; }
  });
  if (changed && depth<10) { runSim(depth+1); return; }

  // Fehlererkennung: Kurzschluss an einem eingeschalteten LS/FI -> auslösen
  let tripped=false;
  insts.forEach(inst=>{
    const s = simState[inst.id]||{};
    if (s.tripped || s.on===false) return;
    const pairs = POLE_PAIRS[inst.type];
    if (!pairs) return;
    for (const [,b] of pairs) {
      const dp = gp(inst.id,b);
      const llFault = !!(dp&ANY_L && (dp&ANY_L)&(( dp&ANY_L)-1));
      if (llFault || ((dp&ANY_L)&&(dp&POT.N)) || ((dp&ANY_L)&&(dp&POT.PE))) {
        simState[inst.id] = {...s, tripped:true, on:false};
        tripped = true; break;
      }
    }
  });
  if (tripped && depth<10) { runSim(depth+1); return; }

  // Port-Potentiale + Knoten für die Anzeige (Leitungsfarbe, Lampen/Motor-Zustand) merken
  simPortPot = {}; simPortNode = {};
  insts.forEach(inst=>{
    SYM[inst.type].ports.forEach((p,pi)=>{
      const key = inst.id+':'+pi;
      const node = idx[key];
      simPortPot[key] = node!=null ? pot[find(node)] : 0;
      simPortNode[key] = node!=null ? find(node) : null;
    });
  });
  rails.forEach(r=>{
    const node = idx['rail:'+r.id];
    simPortPot['rail:'+r.id] = node!=null ? pot[find(node)] : 0;
  });
  render();
}

function toggleSim(){
  simMode = !simMode;
  document.getElementById('btn-sim').classList.toggle('active', simMode);
  document.getElementById('normal-hint').style.display = simMode?'none':'inline';
  document.getElementById('sim-hint').style.display = simMode?'inline':'none';
  if (simMode) { initSimState(); runSim(); }
  else { simState={}; simPortPot={}; simPortNode={}; render(); }
}

function simInstClick(inst){
  const s = simState[inst.id]||{};
  switch(inst.type){
    case 'schalter': simState[inst.id]={...s, closed: s.closed===false}; break;
    case 'wechselschalter': simState[inst.id]={...s, pos: s.pos===1?2:1}; break;
    case 'kreuzschalter': simState[inst.id]={...s, crossed: !s.crossed}; break;
    case 'notaus': simState[inst.id]={...s, latched: !s.latched}; break;
    case 'ls1': case 'ls3': case 'rcbo':
      simState[inst.id] = s.tripped ? {...s, on:true, tripped:false} : {...s, on: s.on===false}; break;
    case 'rcd2': case 'rcd4':
      simState[inst.id] = s.tripped ? {...s, on:true, tripped:false} : {...s, on: s.on===false}; break;
    default: return false;
  }
  runSim();
  return true;
}

// Leiterfarbe nach Potential (gleiche Konvention wie im Aufbauplan: L1 braun, L2 schwarz,
// L3 grau, N blau, PE grün — Priorität bei mehreren Bits auf einem Knoten = Fehlerfall).
function potColor(pot){
  if (!pot) return null;
  if (pot & POT.L1) return '#8B4513';
  if (pot & POT.L2) return '#1f2937';
  if (pot & POT.L3) return '#6b7280';
  if (pot & POT.N) return '#1a56db';
  if (pot & POT.PE) return '#16a34a';
  return null;
}

// Ob ein Bauteil während der Simulation "aktiv" ist (Kontakt geschlossen, Spule
// angezogen, Verbraucher unter Spannung) — für die grüne Hervorhebung im Plan.
function isInstActive(inst){
  if (!simMode) return false;
  const s = simState[inst.id]||{};
  const gp = pi => simPortPot[inst.id+':'+pi] || 0;
  switch(inst.type){
    case 'coil': case 'coil_delay': return !!s.on;
    case 'contact_no': return coilOnForLabel(inst.label);
    case 'contact_nc': return !coilOnForLabel(inst.label);
    case 'taster_no': return !!s.pressed;
    case 'taster_nc': return !s.pressed;
    case 'schalter': return s.closed!==false;
    case 'notaus': return !s.latched;
    case 'ls1': case 'ls3': case 'rcbo': case 'rcd2': case 'rcd4': return s.on!==false && !s.tripped;
    case 'lampe': case 'spot': case 'steckdose': case 'motor1': {
      const p0=gp(0), p1=gp(1);
      return !!((p0&ANY_L)&&(p1&POT.N) || (p1&ANY_L)&&(p0&POT.N));
    }
    case 'motor': { const pu=gp(0),pv=gp(1),pw=gp(2); return !!((pu&ANY_L)&&(pv&ANY_L)&&(pw&ANY_L)); }
    default: return false;
  }
}

function svgPt(clientX, clientY){
  const r = document.getElementById('canvasWrap').getBoundingClientRect();
  return { x:(clientX-r.left-panX)/zoom, y:(clientY-r.top-panY)/zoom };
}
function portWorld(inst, pi){
  const s = SYM[inst.type], p = s.ports[pi];
  return [inst.x+p.x, inst.y+p.y];
}

// Rastet ein Bauteil beim Verschieben an den Anschlusspunkten ANDERER Bauteile ein, sobald
// es nah genug ist — sonst landen unterschiedlich breite Symbole (z.B. Kontakt vs. Spule)
// nur zufällig exakt untereinander, und Verbindungslinien werden schräg/geknickt statt
// gerade. Verschiebt inst.x so, dass der nächstgelegene eigene Port exakt mit dem
// nächstgelegenen fremden Port fluchtet.
function snapInstX(inst){
  const SNAP = 6;
  const s = SYM[inst.type];
  let best = null;
  s.ports.forEach(p=>{
    const myX = inst.x + p.x;
    insts.forEach(other=>{
      if (other===inst) return;
      const os = SYM[other.type];
      os.ports.forEach(op=>{
        const otherX = other.x + op.x;
        const d = Math.abs(myX-otherX);
        if (d<=SNAP && (!best || d<best.d)) best = { d, delta: otherX-myX };
      });
    });
  });
  if (best) inst.x += best.delta;
}

// ── Sidebar aufbauen ─────────────────────────────────────────────────────────
function buildSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML='';
  const rh = document.createElement('div'); rh.className='sb-head'; rh.textContent='Spannungsversorgung'; sb.appendChild(rh);
  Object.entries(RAIL_TYPES).forEach(([key,r])=>{
    const it = document.createElement('div'); it.className='sb-item'; it.draggable=true;
    const svg = document.createElementNS(NS,'svg');
    svg.setAttribute('width',34); svg.setAttribute('height',20); svg.setAttribute('viewBox','0 0 34 20');
    mk('line',{x1:2,y1:10,x2:32,y2:10,stroke:r.color,'stroke-width':2.5},svg);
    it.appendChild(svg);
    const lbl = document.createElement('span'); lbl.textContent=r.label+' (Sammelschiene)'; it.appendChild(lbl);
    it.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', 'rail:'+key); });
    it.addEventListener('click',()=>placeAtViewCenter('rail:'+key));
    sb.appendChild(it);
  });
  CATS.forEach(cat=>{
    const h = document.createElement('div'); h.className='sb-head'; h.textContent=cat; sb.appendChild(h);
    Object.entries(SYM).filter(([k,s])=>s.cat===cat).forEach(([key,s])=>{
      const it = document.createElement('div'); it.className='sb-item'; it.draggable=true;
      const svg = document.createElementNS(NS,'svg');
      svg.setAttribute('width',34); svg.setAttribute('height',34);
      svg.setAttribute('viewBox',`-6 -6 ${Math.max(s.w,20)+12} ${Math.max(s.h,20)+12}`);
      const g = mk('g',{},svg); s.draw(g);
      it.appendChild(svg);
      const lbl = document.createElement('span'); lbl.textContent=s.label; it.appendChild(lbl);
      it.addEventListener('dragstart',e=>{ e.dataTransfer.setData('text/plain', key); });
      it.addEventListener('click',()=>placeAtViewCenter(key));
      sb.appendChild(it);
    });
  });
}

// ── Platzieren: Drag&Drop (Desktop-Maus) + Klick-Fallback (Touch/Tablet, wo
// natives HTML5-Drag&Drop grundsätzlich nicht funktioniert) ────────────────────
function placeAt(type, wx, wy){
  if (type.startsWith('rail:')) {
    const rtype = type.slice(5);
    if (!RAIL_TYPES[rtype]) return;
    const y = Math.round(wy/10)*10;
    rails.push({ id:rid++, type:rtype, y, x1:Math.round((wx-300)/10)*10, x2:Math.round((wx+300)/10)*10 });
    selRail = rails[rails.length-1].id; sel=null; selWire=null; selRailConn=null;
    render(); scheduleAutoSave();
    return;
  }
  if (!SYM[type]) return;
  insts.push({ id:iid++, type, x:Math.round(wx/10)*10, y:Math.round(wy/10)*10, label:'' });
  sel = insts[insts.length-1].id; selWire=null; selRail=null; selRailConn=null;
  render(); scheduleAutoSave();
}
const canvasWrap = document.getElementById('canvasWrap');
canvasWrap.addEventListener('dragover', e=>e.preventDefault());
canvasWrap.addEventListener('drop', e=>{
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  const p = svgPt(e.clientX, e.clientY);
  placeAt(type, p.x, p.y);
});
// Klick auf ein Palette-Element: an der Bildschirmmitte der aktuellen Ansicht platzieren
// (mit kleinem Zufalls-Versatz, damit mehrfaches Klicken nicht exakt übereinander landet).
function placeAtViewCenter(type){
  const rect = canvasWrap.getBoundingClientRect();
  const p = svgPt(rect.left + rect.width/2 + (Math.random()*60-30), rect.top + rect.height/2 + (Math.random()*60-30));
  placeAt(type, p.x, p.y);
}

// ── Pan & Zoom ───────────────────────────────────────────────────────────────
let panDrag = null;
canvasWrap.addEventListener('pointerdown', e=>{
  if (e.target === canvasWrap || e.target.id==='svg') {
    panDrag = {x:e.clientX,y:e.clientY,px:panX,py:panY};
    sel=null; selWire=null; selRail=null; selRailConn=null; wireStart=null; render();
  }
});
window.addEventListener('pointermove', e=>{
  if (panDrag){ panX = panDrag.px + (e.clientX-panDrag.x); panY = panDrag.py + (e.clientY-panDrag.y); applyTransform(); }
});
window.addEventListener('pointerup', ()=>{ panDrag=null; });
canvasWrap.addEventListener('wheel', e=>{
  e.preventDefault();
  const factor = e.deltaY<0 ? 1.1 : 1/1.1;
  setZoom(zoom*factor, e.clientX, e.clientY);
}, {passive:false});
function setZoom(z, cx, cy){
  z = Math.max(0.3, Math.min(3, z));
  const r = canvasWrap.getBoundingClientRect();
  const px = cx!=null?cx-r.left:r.width/2, py = cy!=null?cy-r.top:r.height/2;
  const wx = (px-panX)/zoom, wy=(py-panY)/zoom;
  zoom = z;
  panX = px - wx*zoom; panY = py - wy*zoom;
  applyTransform();
}
function resetView(){ zoom=1; panX=80; panY=40; applyTransform(); }
function applyTransform(){ document.getElementById('svg').setAttribute('transform',`translate(${panX},${panY}) scale(${zoom})`); }

// ── Rendern ──────────────────────────────────────────────────────────────────
function render(){
  const svg = document.getElementById('svg');
  svg.innerHTML='';
  svg.setAttribute('width', 4000); svg.setAttribute('height', 3000);
  applyTransform();

  // Sammelschienen (L1/L2/L3/N/PE) — durchgehende Linien, an die überall entlang
  // angedockt werden kann.
  rails.forEach(r=>{
    const rt = RAIL_TYPES[r.type];
    const isSel = selRail===r.id;
    mk('line',{x1:r.x1,y1:r.y,x2:r.x2,y2:r.y,stroke:rt.color,'stroke-width':isSel?3.2:2.4},svg);
    mk('rect',{x:r.x1-4,y:r.y-11,width:26,height:14,fill:'#fff',opacity:0.9},svg);
    mk('text',{x:r.x1,y:r.y-1,'font-size':11,'font-weight':'bold',fill:rt.color},svg).textContent=rt.label;
    // Ziehfläche für die ganze Schiene (Position/Höhe verschieben) + Auswahl
    const hit = mk('line',{x1:r.x1,y1:r.y,x2:r.x2,y2:r.y,stroke:'transparent','stroke-width':14,cursor:'pointer'},svg);
    hit.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      if (wireStart){
        // Bauteil-Anschluss mit der Schiene an dieser Stelle verbinden
        const p = svgPt(e.clientX,e.clientY);
        const rx = Math.max(r.x1, Math.min(r.x2, Math.round(p.x/10)*10));
        railConns.push({ id:rcid++, fid:wireStart.instId, fp:wireStart.portIdx, rail:r.id, rx });
        wireStart = null; scheduleAutoSave(); render();
        return;
      }
      sel=null; selWire=null; selRailConn=null; selRail=r.id; render();
      const start = svgPt(e.clientX,e.clientY);
      const oy = start.y - r.y;
      const onMove = ev=>{
        const p = svgPt(ev.clientX,ev.clientY);
        r.y = Math.round((p.y-oy)/10)*10;
        render();
      };
      const onUp = ()=>{ window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); scheduleAutoSave(); };
      window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp);
    });
    // Endpunkt-Griffe zum Verlängern/Verkürzen
    [['x1',r.x1],['x2',r.x2]].forEach(([key,xv])=>{
      const handle = mk('rect',{x:xv-4,y:r.y-4,width:8,height:8,fill:'#fff',stroke:rt.color,'stroke-width':1.5,cursor:'ew-resize'},svg);
      handle.addEventListener('pointerdown', e=>{
        e.stopPropagation(); sel=null; selWire=null; selRailConn=null; selRail=r.id; render();
        const onMove = ev=>{
          const p = svgPt(ev.clientX,ev.clientY);
          r[key] = Math.round(p.x/10)*10;
          render();
        };
        const onUp = ()=>{ window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); scheduleAutoSave(); };
        window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp);
      });
    });
  });

  // Verbindungen von Bauteil-Anschlüssen zu einer Sammelschiene: erst waagerecht auf
  // Port-Höhe zur Andockstelle, dann senkrecht zur Schiene.
  railConns.forEach(rc=>{
    const fi = insts.find(i=>i.id===rc.fid);
    const rail = rails.find(r=>r.id===rc.rail);
    if (!fi || !rail) return;
    const [ax,ay] = portWorld(fi, rc.fp);
    const rt = RAIL_TYPES[rail.type];
    const d = `M${ax},${ay} L${rc.rx},${ay} L${rc.rx},${rail.y}`;
    mk('path',{d,fill:'none',stroke: selRailConn===rc.id?'#2563eb':rt.color,'stroke-width':selRailConn===rc.id?2.4:1.8,opacity:0.85},svg);
    mk('circle',{cx:rc.rx,cy:rail.y,r:2.5,fill:rt.color},svg);
    const hit = mk('path',{d,fill:'none',stroke:'transparent','stroke-width':12,cursor:'pointer'},svg);
    hit.addEventListener('pointerdown',e=>{ e.stopPropagation(); sel=null; selRail=null; selWire=null; selRailConn=rc.id; render(); });
  });

  // Leitungen
  wires.forEach(w=>{
    const fi = insts.find(i=>i.id===w.fid), ti = insts.find(i=>i.id===w.tid);
    if (!fi||!ti) return;
    const [ax,ay] = portWorld(fi,w.fp), [bx,by] = portWorld(ti,w.tp);
    const midY = (ay+by)/2;
    const d = Math.abs(ax-bx)<2 ? `M${ax},${ay} L${bx},${by}` : `M${ax},${ay} L${ax},${midY} L${bx},${midY} L${bx},${by}`;
    let stroke = selWire===w.id?'#2563eb':'#374151', sw = selWire===w.id?2.4:1.8;
    if (simMode) {
      const pc = potColor(simPortPot[w.fid+':'+w.fp] || simPortPot[w.tid+':'+w.tp] || 0);
      if (pc) { stroke = pc; sw = 2.6; }
    }
    mk('path',{d,fill:'none',stroke,'stroke-width':sw},svg);
    const hit = mk('path',{d,fill:'none',stroke:'transparent','stroke-width':12,cursor:'pointer'},svg);
    hit.addEventListener('pointerdown',e=>{ e.stopPropagation(); if(simMode) return; sel=null; selWire=w.id; selRail=null; selRailConn=null; render(); });
  });

  // Symbole
  insts.forEach(inst=>{
    const s = SYM[inst.type];
    const g = mk('g',{transform:`translate(${inst.x},${inst.y})`},svg);
    if (sel===inst.id) mk('rect',{x:-6,y:-6,width:s.w+12,height:s.h+12,rx:5,fill:'rgba(37,99,235,0.08)',stroke:'#2563eb','stroke-width':1.3,'stroke-dasharray':'3,2'},g);
    // Zusatzrahmen nur noch für Bauteile ohne eigene Zustandszeichnung (Spulen: keine
    // Kontaktzunge, die sich bewegen könnte). Kontakte/Schalter/Sicherungen zeigen ihren
    // Zustand jetzt direkt am Symbol (Zunge offen/zu), Lampen/Motoren/Steckdosen leuchten
    // stattdessen selbst (siehe deren draw()).
    if (simMode) {
      const simSt = simState[inst.id]||{};
      const isBreaker = ['ls1','ls3','rcd2','rcd4','rcbo'].includes(inst.type);
      if (isBreaker && simSt.tripped) mk('rect',{x:-6,y:-6,width:s.w+12,height:s.h+12,rx:5,fill:'rgba(249,115,22,0.15)',stroke:'#f97316','stroke-width':1.6},g);
      else if (inst.type==='coil' || inst.type==='coil_delay') {
        if (isInstActive(inst)) mk('rect',{x:-6,y:-6,width:s.w+12,height:s.h+12,rx:5,fill:'rgba(34,197,94,0.15)',stroke:'#22c55e','stroke-width':1.6},g);
      }
    }
    s.draw(g, inst);
    const lbl = inst.label || '';
    if (lbl) mk('text',{x:s.w/2,y:-8,'text-anchor':'middle','font-size':10,'font-weight':'bold',fill:'#111'},g).textContent=lbl;
    // Body-Drag zum Verschieben + Auswahl + Doppelklick=Beschriften (VOR den Ports einfügen,
    // damit die Port-Kreise beim Klicken obenauf liegen und nicht von der Drag-Hitbox verdeckt werden)
    const hitBox = mk('rect',{x:-4,y:-4,width:s.w+8,height:s.h+8,fill:'transparent',cursor: simMode?'pointer':'grab'},g);
    let lastClick=0;
    hitBox.addEventListener('pointerdown', e=>{
      e.stopPropagation();
      if (simMode) {
        if (inst.type==='taster_no' || inst.type==='taster_nc') {
          simState[inst.id] = { ...(simState[inst.id]||{}), pressed:true };
          runSim();
          const onUp = () => {
            simState[inst.id] = { ...(simState[inst.id]||{}), pressed:false };
            runSim();
            document.removeEventListener('pointerup', onUp);
          };
          document.addEventListener('pointerup', onUp);
        } else {
          simInstClick(inst);
        }
        return;
      }
      if (wireStart) return;
      sel = inst.id; selWire=null; selRail=null; selRailConn=null; render();
      const now = Date.now();
      if (now-lastClick<350) { renameInst(inst); lastClick=0; return; }
      lastClick = now;
      const start = svgPt(e.clientX,e.clientY);
      const ox = start.x-inst.x, oy = start.y-inst.y;
      const onMove = ev=>{
        const p = svgPt(ev.clientX,ev.clientY);
        inst.x = Math.round((p.x-ox)/10)*10; inst.y = Math.round((p.y-oy)/10)*10;
        snapInstX(inst);
        render();
      };
      const onUp = ()=>{ window.removeEventListener('pointermove',onMove); window.removeEventListener('pointerup',onUp); scheduleAutoSave(); };
      window.addEventListener('pointermove',onMove); window.addEventListener('pointerup',onUp);
    });
    // Ports (nach der Drag-Hitbox eingefügt, damit sie im SVG-Malreihenfolge obenauf liegen)
    s.ports.forEach((p,pi)=>{
      const port = mk('g',{class:'port-hit',transform:`translate(${p.x},${p.y})`},g);
      mk('circle',{r:4,fill:'#fff',stroke:'#6b7280','stroke-width':1.3},port);
      port.addEventListener('pointerdown', e=>{
        e.stopPropagation();
        if (!wireStart){ wireStart = {instId:inst.id, portIdx:pi}; render(); }
        else {
          if (!(wireStart.instId===inst.id && wireStart.portIdx===pi)) {
            wires.push({id:wid++, fid:wireStart.instId, fp:wireStart.portIdx, tid:inst.id, tp:pi});
            scheduleAutoSave();
          }
          wireStart = null; render();
        }
      });
    });
  });

  // Laufende Leitung beim Verbinden
  if (wireStart) {
    const fi = insts.find(i=>i.id===wireStart.instId);
    if (fi) {
      const [ax,ay] = portWorld(fi, wireStart.portIdx);
      mk('circle',{cx:ax,cy:ay,r:6,fill:'none',stroke:'#2563eb','stroke-width':2,opacity:0.6},svg);
    }
  }
}
document.addEventListener('pointermove', e=>{
  if (!wireStart) return;
  // Vorschau-Linie zum Cursor
  let prev = document.getElementById('wire-preview');
  const fi = insts.find(i=>i.id===wireStart.instId); if (!fi) return;
  const [ax,ay] = portWorld(fi, wireStart.portIdx);
  const p = svgPt(e.clientX,e.clientY);
  if (!prev) prev = mk('line',{id:'wire-preview',stroke:'#2563eb','stroke-width':1.5,'stroke-dasharray':'4,3','pointer-events':'none'},document.getElementById('svg'));
  prev.setAttribute('x1',ax); prev.setAttribute('y1',ay); prev.setAttribute('x2',p.x); prev.setAttribute('y2',p.y);
});

function renameInst(inst){
  const v = prompt('Beschriftung/Bauteilkennzeichen (z.B. K1, S1, M1):', inst.label||'');
  if (v!==null){ inst.label=v; render(); scheduleAutoSave(); }
}

function doDeleteSel(){
  if (sel!=null){
    insts = insts.filter(i=>i.id!==sel);
    wires = wires.filter(w=>w.fid!==sel && w.tid!==sel);
    railConns = railConns.filter(rc=>rc.fid!==sel);
    sel=null;
  } else if (selWire!=null){
    wires = wires.filter(w=>w.id!==selWire);
    selWire=null;
  } else if (selRail!=null){
    rails = rails.filter(r=>r.id!==selRail);
    railConns = railConns.filter(rc=>rc.rail!==selRail);
    selRail=null;
  } else if (selRailConn!=null){
    railConns = railConns.filter(rc=>rc.id!==selRailConn);
    selRailConn=null;
  }
  render(); scheduleAutoSave();
}
document.addEventListener('keydown', e=>{
  if (e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA') return;
  if (e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); doDeleteSel(); }
  if (e.key==='Escape'){ wireStart=null; render(); }
});

function doNew(){
  if (!insts.length && !wires.length && !rails.length) return;
  if (!confirm('Zeichnung wirklich leeren?')) return;
  insts=[]; wires=[]; rails=[]; railConns=[]; iid=1; wid=1; rid=1; rcid=1;
  sel=null; selWire=null; selRail=null; selRailConn=null;
  render(); scheduleAutoSave();
}

function buildSaveData(){ return { insts, wires, rails, railConns, iid, wid, rid, rcid }; }
function doSave(){
  const blob = new Blob([JSON.stringify(buildSaveData(),null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'stromlaufplan.json'; a.click();
  URL.revokeObjectURL(a.href);
}
function doLoad(){
  const inp = document.createElement('input'); inp.type='file'; inp.accept='.json';
  inp.onchange = e=>{
    const file = e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{ try{ importData(JSON.parse(ev.target.result)); } catch(err){ alert('Ladefehler: '+err.message); } };
    reader.readAsText(file);
  };
  inp.click();
}
function importData(data){
  insts = (data.insts||[]).filter(i=>SYM[i.type]);
  wires = data.wires||[];
  rails = (data.rails||[]).filter(r=>RAIL_TYPES[r.type]);
  railConns = data.railConns||[];
  iid = data.iid || (Math.max(0,...insts.map(i=>i.id))+1);
  wid = data.wid || (Math.max(0,...wires.map(w=>w.id))+1);
  rid = data.rid || (Math.max(0,...rails.map(r=>r.id))+1);
  rcid = data.rcid || (Math.max(0,...railConns.map(rc=>rc.id))+1);
  sel=null; selWire=null; selRail=null; selRailConn=null;
  render(); scheduleAutoSave();
}

let _asTimer=null;
function scheduleAutoSave(){
  clearTimeout(_asTimer);
  _asTimer = setTimeout(()=>{ try{ localStorage.setItem('stromlaufplan_manual_v1', JSON.stringify(buildSaveData())); }catch(e){} }, 600);
}
(function initLoad(){
  try {
    const raw = localStorage.getItem('stromlaufplan_manual_v1');
    if (raw) importData(JSON.parse(raw));
  } catch(e){}
})();

function toggleSidebar(){ document.getElementById('sidebar').classList.toggle('open'); }
if (window.innerWidth<768) document.getElementById('btn-ham').style.display='';

buildSidebar();
render();
</script>
</body>
