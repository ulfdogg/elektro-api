<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',Arial,sans-serif;background:#e8edf2;color:#1f2937}
  #bar{background:#1a365d;color:#fff;padding:0 16px;height:48px;display:flex;align-items:center;gap:16px;

<body>
<div id="bar">
  <a href="/">← Zurück zum Aufbauplan</a>
  <h1>⚡ Stromlaufplan — aufgelöste Darstellung</h1>
  <span class="hint">automatisch erzeugt · schreibgeschützt</span>
</div>
<div id="wrap"><div id="empty" style="display:none">Kein Aufbau gefunden. Öffne zuerst den Aufbauplan und baue eine Schaltung.</div><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
const NS='http://www.w3.org/2000/svg';
function mk(tag,attrs,parent){
  const el=document.createElementNS(NS,tag);
  for(const k in attrs) el.setAttribute(k,attrs[k]);
  if(parent) parent.appendChild(el);
  return el;
}

// Nicht elektrisch relevant für die aufgelöste Darstellung: Strukturteile + reine Durchgangsklemmen/-schienen
const SKIP_TYPES = new Set([
  'uv','uv2','uv3','hutschiene','aufputzgehaeuse1','aufputzgehaeuse2','aufputzgehaeuse3','kabelkanal',
  'cee16_kupplung',
  'nblock','peblock','klemme','klemme25','klemme25_twin','knotenpunkt','wago2','wago3','wago5',
  'drucktaster', // hat selbst keine Anschlüsse — wirkt nur über NC/NO/LED-Kontakte im selben Gehäuse
]);

const TOP_RAILS = ['L1','L2','L3'];
const BOT_RAILS = ['N','PE'];
// CEE-Kupplung Portindex → Sammelschiene (fest, siehe Bauteil-Definition in der Haupt-App)
const CEE_PORT_RAIL = ['L1','L2','L3','N','PE'];
// Reine Durchgangs-/Sammel-Bauteile: Schienen-Zugehörigkeit wird durch sie hindurch weitergereicht
const PASSTHROUGH_TYPES = new Set(['nblock','peblock','klemme','klemme25','klemme25_twin','knotenpunkt','wago2','wago3','wago5']);

// Polpaare (Eingang→Ausgang) für mehrpolige Schutzorgane — aus der Simulationslogik der Haupt-App übernommen
const POLE_PAIRS = {
  ls1:  [[0,1]],
  ls3:  [[0,3],[1,4],[2,5]],
  rcd2: [[0,2],[1,3]],
  rcd4: [[0,4],[1,5],[2,6],[3,7]],
  rcbo: [[0,1],[2,3]],
};

// Bauteile mit Kontakt+Spule-Kombination: werden in einzelne, unabhängig platzierte
// Schaltzeichen aufgelöst (Kontakte dahin wo sie gebraucht werden, Spule separat) — statt EINER Box.
const SPLIT_ELEMENTS = {
  schuetz: [
    {suffix:'p1',  ports:[0,3],  sym:'contact_no', tag:'1-2'},
    {suffix:'p2',  ports:[1,4],  sym:'contact_no', tag:'3-4'},
    {suffix:'p3',  ports:[2,5],  sym:'contact_no', tag:'5-6'},
    {suffix:'no1', ports:[6,7],  sym:'contact_no', tag:'13-14'},
    {suffix:'nc1', ports:[8,9],  sym:'contact_nc', tag:'21-22'},
    {suffix:'nc2', ports:[10,11],sym:'contact_nc', tag:'31-32'},
    {suffix:'no2', ports:[12,13],sym:'contact_no', tag:'43-44'},
    {suffix:'coil',ports:[14,15],sym:'coil',       tag:'A1-A2'},
  ],
  stromstoss: [
    {suffix:'no1', ports:[1,4], sym:'contact_no', tag:'13-14'},
    {suffix:'no2', ports:[2,5], sym:'contact_no', tag:'21-22'},
    {suffix:'coil',ports:[0,3], sym:'coil',       tag:'A1-A2'},
  ],
};

function symbolFor(type) {
  if (['schalter','taster','wechsel','kreuzschalter','kontakt_no','kontakt_led'].includes(type)) return 'contact_no';
  if (type==='kontakt_nc') return 'contact_nc';
  if (POLE_PAIRS[type]) return 'breaker';
  if (type==='bewegungsmelder') return 'motion';
  if (type==='lampe' || type==='spot') return 'lamp';
  if (type==='motor' || type==='dahlander') return 'motor';
  if (type==='steckdose') return 'socket';
  return null;
}

function drawSymbol(svg, sym, x, y, w, h, label, compType) {
  const cx=x+w/2, cy=y+h/2;
  const stroke = '#1f2937';
  mk('text',{x:cx, y:y-8, 'text-anchor':'middle', 'font-size':9, fill:stroke, 'font-weight':'bold'},svg).textContent=label;

  function contactGlyph(gx, gy, gw, gh, nc){
    const p1x=gx, p2x=gx+gw, midy=gy+gh/2;
    mk('line',{x1:p1x,y1:gy,x2:p1x,y2:midy,stroke,'stroke-width':1.4},svg);
    mk('line',{x1:p2x,y1:midy,x2:p2x,y2:gy+gh,stroke,'stroke-width':1.4},svg);
    mk('line',{x1:p1x,y1:midy,x2:p2x-3,y2:midy-gh*0.32,stroke,'stroke-width':1.6,'stroke-linecap':'round'},svg);
    mk('circle',{cx:p1x,cy:midy,r:1.6,fill:stroke},svg);
    mk('circle',{cx:p2x,cy:midy,r:1.6,fill:stroke},svg);
    if (nc) mk('line',{x1:p2x-7,y1:midy-gh*0.44,x2:p2x-1,y2:midy-gh*0.2,stroke,'stroke-width':1.3},svg);
  }
  // Trenn-/Leistungsschalter nach DIN EN 60617-7: einfacher Schalterstrich, kein Zusatzsymbol
  function breakerGlyph(gx, gy, gw, gh){
    const px=gx+gw/2, midy=gy+gh/2;
    mk('line',{x1:px,y1:gy,x2:px,y2:midy-2,stroke,'stroke-width':1.4},svg);
    mk('line',{x1:px,y1:midy+11,x2:px,y2:gy+gh,stroke,'stroke-width':1.4},svg);
    mk('line',{x1:px,y1:midy-2,x2:px+11,y2:midy-13,stroke,'stroke-width':1.6,'stroke-linecap':'round'},svg);
    mk('circle',{cx:px,cy:midy-2,r:1.6,fill:stroke},svg);
    mk('circle',{cx:px,cy:midy+11,r:1.6,fill:stroke},svg);
  }

  switch(sym){
    case 'contact_no': contactGlyph(x+13, y, w-26, h, false); break;
    case 'contact_nc': contactGlyph(x+13, y, w-26, h, true); break;
    case 'coil': {
      const cw=Math.min(w-16,30), ch=Math.min(h-14,22);
      mk('rect',{x:cx-cw/2,y:cy-ch/2,width:cw,height:ch,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-ch/2,stroke,'stroke-width':1.4},svg);
      mk('line',{x1:cx,y1:cy+ch/2,x2:cx,y2:y+h,stroke,'stroke-width':1.4},svg);
      break;
    }
    case 'breaker': {
      const poles = POLE_PAIRS[compType] || [[0,1]];
      const gw = Math.min(30, (w-16)/poles.length);
      poles.forEach((_,i)=>{
        const gx = x + 8 + i*((w-16)/poles.length) + ((w-16)/poles.length-gw)/2;
        breakerGlyph(gx, y, gw, h);
      });
      break;
    }
    case 'motion': {
      contactGlyph(x+13, y+10, w-26, h-10, false);
      mk('path',{d:`M${cx-11},${y+9} Q${cx},${y-2} ${cx+11},${y+9}`,fill:'none',stroke,'stroke-width':1.3},svg);
      break;
    }
    case 'lamp': {
      mk('circle',{cx,cy,r:13,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('line',{x1:cx-8,y1:cy-8,x2:cx+8,y2:cy+8,stroke,'stroke-width':1.2},svg);
      mk('line',{x1:cx-8,y1:cy+8,x2:cx+8,y2:cy-8,stroke,'stroke-width':1.2},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-13,stroke,'stroke-width':1.5},svg);
      mk('line',{x1:cx,y1:cy+13,x2:cx,y2:y+h,stroke,'stroke-width':1.5},svg);
      break;
    }
    case 'motor': {
      mk('circle',{cx,cy,r:15,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('text',{x:cx,y:cy+4,'text-anchor':'middle','font-size':11,fill:stroke,'font-weight':'bold'},svg).textContent='M';
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-15,stroke,'stroke-width':1.5},svg);
      break;
    }
    case 'socket': {
      mk('circle',{cx,cy,r:13,fill:'#fff',stroke,'stroke-width':1.5},svg);
      mk('circle',{cx:cx-4,cy,r:1.6,fill:stroke},svg);
      mk('circle',{cx:cx+4,cy,r:1.6,fill:stroke},svg);
      mk('line',{x1:cx,y1:y,x2:cx,y2:cy-13,stroke,'stroke-width':1.5},svg);
      break;
    }
    default:
      mk('rect',{x,y,width:w,height:h,rx:4,fill:'#fff',stroke:'#334155','stroke-width':1.5},svg);
  }
}

let allComps = [], comps = [], wires = [];

function loadAndRender(){
  let data = {comps:[], wires:[]};
  try {
    const raw = localStorage.getItem('elektroplan_v1');
    if (raw) data = JSON.parse(raw);
  } catch(e) {}
  allComps = data.comps || [];
  comps = allComps.filter(c=>!SKIP_TYPES.has(c.type));
  wires = data.wires || [];

  const svgEl = document.getElementById('svg');
  while (svgEl.firstChild) svgEl.removeChild(svgEl.firstChild);

  if (!comps.length) {
    document.getElementById('empty').style.display='';
  } else {
    document.getElementById('empty').style.display='none';
    render();
  }
}
loadAndRender();
window.addEventListener('storage', e=>{ if (e.key==='elektroplan_v1') loadAndRender(); });
let _lastRaw = localStorage.getItem('elektroplan_v1');
setInterval(()=>{
  const cur = localStorage.getItem('elektroplan_v1');
  if (cur !== _lastRaw) { _lastRaw = cur; loadAndRender(); }
}, 1500);

// Für einen Anschluss (compId,portIdx) den Graph-Knoten bestimmen: bei aufgelösten
// Bauteilen (Schütz, Stromstoß) das jeweilige Einzelelement, sonst das ganze Bauteil.
function nodeIdForPort(compById, cid, pi){
  const c = compById[cid];
  if (!c) return cid+':main';
  const split = SPLIT_ELEMENTS[c.type];
  if (!split) return cid+':main';
  const el = split.find(e=>e.ports.includes(pi));
  return el ? cid+':'+el.suffix : cid+':main';
}

// Für die TIEFE brauchen wir feinere Granularität als nodeIdForPort: bei einem normalen
// Mehrport-Bauteil (Motor, mehrpolige Sicherung, ...) ist der PE/N-Anschluss oft kurz zur
// Quelle verdrahtet, während die Leistungs-Adern einen langen Weg über Schütze gehen —
// wenn alle Ports EIN Knoten wären, würde das kürzeste Signal das ganze Bauteil nach oben
// ziehen. Also: jeder Port sein eigener Tiefen-Knoten, außer bei echten Durchgangs-Bauteilen
// (Klemmen) und bei den definierten Kontakt-Paaren (Schütz-Polen).
function depthNodeId(compById, cid, pi){
  const c = compById[cid];
  if (!c) return cid+':'+pi;
  if (PASSTHROUGH_TYPES.has(c.type)) return cid+':bus';
  const split = SPLIT_ELEMENTS[c.type];
  if (split) {
    const el = split.find(e=>e.ports.includes(pi));
    return el ? cid+':'+el.suffix : cid+':'+pi;
  }
  return cid+':'+pi;
}

function isPassthrough(compById, cid){
  const c = compById[cid];
  return !!(c && PASSTHROUGH_TYPES.has(c.type));
}

// Für die Schienen-Zugehörigkeit brauchen wir FEINERE Granularität als für die Tiefe:
// bei einem Durchgangs-Bauteil (Klemme etc.) sind alle Ports EIN Knoten (wirklich intern
// verbunden), bei jedem anderen Bauteil (auch mehrpolige Sicherungen etc.) bleibt jeder
// Port sein eigener Knoten — sonst würde z.B. der Ausgang einer Sicherung fälschlich auch
// als "direkt an der Schiene" gelten, nur weil ihr Eingang es ist.
function railNodeId(compById, cid, pi){
  return isPassthrough(compById, cid) ? cid+':bus' : cid+':'+pi;
}

// Berechnet aus der ECHTEN Verdrahtung (nicht aus Aderfarbe geraten):
//  - depth: Hop-Abstand jedes (Element-)Knotens von der CEE-Kupplung (für die Zeilen-Reihenfolge)
//  - railOf: nur für PORTS, die AUSSCHLIESSLICH über Durchgangs-Bauteile (Klemmen, Sammelschienen)
//    mit einem CEE-Pol verbunden sind — die bekommen einen direkten Schienen-Stub statt einer
//    normalen Verbindungslinie. Sobald ein "echtes" Bauteil (Sicherung, Schütz, ...) dazwischen
//    liegt, endet die Schienen-Zugehörigkeit dort (genau wie in einem echten Stromlaufplan).
function computeTopology(compById){
  const depthAdj = {};
  const addDepthEdge = (a,b)=>{ (depthAdj[a]||(depthAdj[a]=[])).push(b); (depthAdj[b]||(depthAdj[b]=[])).push(a); };
  wires.forEach(w=> addDepthEdge(depthNodeId(compById,w.fid,w.fp), depthNodeId(compById,w.tid,w.tp)));

  const railAdj = {};
  const addRailEdge = (a,b)=>{ (railAdj[a]||(railAdj[a]=[])).push(b); (railAdj[b]||(railAdj[b]=[])).push(a); };
  wires.forEach(w=> addRailEdge(railNodeId(compById,w.fid,w.fp), railNodeId(compById,w.tid,w.tp)));

  const cee = Object.values(compById).find(c=>c.type==='cee16_kupplung');

  const depth = {};
  const dq = [];
  const railOf = {};
  const rq = [];
  if (cee) {
    wires.forEach(w=>{
      let otherD=null, otherR=null, ceePort=null;
      if (w.fid===cee.id) { otherD=depthNodeId(compById,w.tid,w.tp); otherR=railNodeId(compById,w.tid,w.tp); ceePort=w.fp; }
      else if (w.tid===cee.id) { otherD=depthNodeId(compById,w.fid,w.fp); otherR=railNodeId(compById,w.fid,w.fp); ceePort=w.tp; }
      if (otherD==null) return;
      if (depth[otherD]===undefined) { depth[otherD]=0; dq.push(otherD); }
      const rail = CEE_PORT_RAIL[ceePort];
      if (rail && railOf[otherR]===undefined) { railOf[otherR]=rail; rq.push(otherR); }
    });
  }
  let dqi=0;
  while (dqi<dq.length) {
    const cur=dq[dqi++];
    (depthAdj[cur]||[]).forEach(to=>{
      if (depth[to]===undefined) { depth[to]=depth[cur]+1; dq.push(to); }
    });
  }
  let rqi=0;
  while (rqi<rq.length) {
    const cur=rq[rqi++];
    if (!isPassthrough(compById, cur.split(':')[0])) continue; // nur durch Durchgangs-Bauteile weiterreichen
    (railAdj[cur]||[]).forEach(to=>{
      if (railOf[to]===undefined) { railOf[to]=railOf[cur]; rq.push(to); }
    });
  }
  return {depth, railOf};
}

// NC/NO/LED-Kontakte, die im selben Gehäuse wie ein (nicht gezeichneter) Drucktaster sitzen,
// übernehmen dessen Bezeichnung (z.B. "S1") — so sind sie über die Bezeichnung verknüpft,
// auch wenn sie an ganz anderer Stelle im Plan stehen.
function labelFor(c){
  if (['kontakt_no','kontakt_nc','kontakt_led'].includes(c.type) && c.housingId!=null) {
    const btn = allComps.find(a=>a.type==='drucktaster' && a.housingId===c.housingId && a.rowIdx===c.rowIdx);
    if (btn && btn.label && btn.label!==btn.type && btn.label!=='Drucktaster') return btn.label;
  }
  return c.label || c.type;
}

// Aus den (nicht übersprungenen) Bauteilen die zu zeichnenden Elemente bauen — bei Schütz/
// Stromstoß mehrere unabhängige Elemente statt einem.
function buildElements(usedPorts){
  const elements = [];
  comps.forEach(c=>{
    const allPorts = [...(usedPorts[c.id]||[])];
    const split = SPLIT_ELEMENTS[c.type];
    if (split) {
      split.forEach(el=>{
        const ports = allPorts.filter(pi=>el.ports.includes(pi)).sort((a,b)=>a-b);
        if (!ports.length) return; // unbenutzte Kontakte/Spule des Bauteils ausblenden, kein Ballast
        elements.push({
          nodeId: c.id+':'+el.suffix,
          label: labelFor(c) + (el.tag ? (' '+el.tag) : ''),
          sym: el.sym, compType: c.type, ports, x: c.x,
        });
      });
    } else {
      elements.push({
        nodeId: c.id+':main',
        label: labelFor(c),
        sym: symbolFor(c.type), compType: c.type,
        ports: allPorts.sort((a,b)=>a-b), x: c.x,
      });
    }
  });
  return elements;
}

function render(){
  const usedPorts = {};
  wires.forEach(w=>{
    (usedPorts[w.fid]||(usedPorts[w.fid]=new Set())).add(w.fp);
    (usedPorts[w.tid]||(usedPorts[w.tid]=new Set())).add(w.tp);
  });

  const compById = {}; allComps.forEach(c=>compById[c.id]=c);
  const {depth, railOf} = computeTopology(compById);
  const elements = buildElements(usedPorts);

  // Tiefe pro Element = MAXIMUM über seine eigenen Ports (nicht Minimum!) — ein Bauteil muss
  // unter ALLEM stehen, was es speist, nicht nur hinter seiner kürzesten (z.B. PE-)Verbindung.
  elements.forEach(e=>{
    const [compId] = e.nodeId.split(':');
    let d;
    e.ports.forEach(pi=>{
      const pd = depth[depthNodeId(compById, compId, pi)];
      if (pd!==undefined && (d===undefined || pd>d)) d = pd;
    });
    e.elDepth = d;
  });

  const maxKnownDepth = Math.max(0, ...elements.map(e=>e.elDepth).filter(d=>d!==undefined));
  const fallbackDepth = maxKnownDepth + 1;

  const BOXH=52, PORTGAP=26, BOXMINW=68, HGAP=30, MARGIN=50;
  const TOPRAIL_GAP=20, BANDH=100, RAILSPACE=90;

  const items = elements.slice().sort((a,b)=>{
    const da = a.elDepth!==undefined?a.elDepth:fallbackDepth;
    const db = b.elDepth!==undefined?b.elDepth:fallbackDepth;
    return da-db || a.x-b.x;
  });
  const nBands = fallbackDepth+1;
  const bandItems = Array.from({length:nBands},()=>[]);
  items.forEach(e=>{
    const d = e.elDepth!==undefined?e.elDepth:fallbackDepth;
    bandItems[d].push(e);
  });

  const boxes = [];
  const portPos = {};
  let maxRowW = 0;
  const topRailsH = MARGIN + (TOP_RAILS.length-1)*TOPRAIL_GAP + 10;

  bandItems.forEach((list, bi) => {
    let x = MARGIN;
    const y = topRailsH + RAILSPACE + bi*BANDH;
    list.forEach(e=>{
      const w = Math.max(BOXMINW, e.ports.length*PORTGAP + 14);
      boxes.push({e,x,y,w,h:BOXH});
      const [compId] = e.nodeId.split(':');
      e.ports.forEach((pi,i)=>{
        const px = x + 10 + i*PORTGAP + PORTGAP/2 - 13;
        portPos[compId+':'+pi] = {x:px, y};
      });
      x += w + HGAP;
    });
    if (x > maxRowW) maxRowW = x;
  });

  const totalW = Math.max(700, maxRowW + MARGIN);
  const botRailsY = topRailsH + RAILSPACE + nBands*BANDH + 20;
  const totalH = botRailsY + (BOT_RAILS.length-1)*TOPRAIL_GAP + 40;

  const svg = document.getElementById('svg');
  svg.setAttribute('width', totalW);
  svg.setAttribute('height', totalH);
  svg.setAttribute('viewBox', `0 0 ${totalW} ${totalH}`);

  const railY = {};
  TOP_RAILS.forEach((r,i)=>{ railY[r] = MARGIN + i*TOPRAIL_GAP; });
  BOT_RAILS.forEach((r,i)=>{ railY[r] = botRailsY + i*TOPRAIL_GAP; });
  [...TOP_RAILS, ...BOT_RAILS].forEach(r=>{
    const y = railY[r];
    const col = r==='L1'?'#8B4513':r==='L2'?'#222':r==='L3'?'#6b7280':r==='N'?'#1a56db':'#16a34a';
    mk('line',{x1:MARGIN-10,y1:y,x2:totalW-MARGIN+10,y2:y,stroke:col,'stroke-width':2.5},svg);
    mk('text',{x:14,y:y+4,'font-size':11,fill:col,'font-weight':'bold'},svg).textContent=r;
  });

  const stubbed = new Set();
  const usedRailStub = key=>{ if(stubbed.has(key)) return true; stubbed.add(key); return false; };

  wires.forEach(w=>{
    // Pro Ader beide Enden UNABHÄNGIG prüfen: nur wer wirklich (über Klemmen) an einem
    // CEE-Pol hängt, bekommt einen Schienen-Stub — nicht die ganze Ader automatisch.
    let stubbedAny = false;
    [[w.fid,w.fp],[w.tid,w.tp]].forEach(([cid,pi])=>{
      const rail = railOf[railNodeId(compById,cid,pi)];
      if (!rail) return;
      const p = portPos[cid+':'+pi];
      if (!p) return;
      stubbedAny = true;
      const key = cid+':'+pi+':'+rail;
      if (usedRailStub(key)) return;
      mk('line',{x1:p.x,y1:p.y,x2:p.x,y2:railY[rail],stroke:w.color||'#6b7280','stroke-width':1.8,opacity:0.85},svg);
      mk('circle',{cx:p.x,cy:railY[rail],r:2.5,fill:w.color||'#6b7280'},svg);
    });
    if (stubbedAny) return;
    const a = portPos[w.fid+':'+w.fp], b = portPos[w.tid+':'+w.tp];
    if (!a || !b) return;
    const midY = (a.y+b.y)/2;
    const d = `M${a.x},${a.y} L${a.x},${midY} L${b.x},${midY} L${b.x},${b.y}`;
    mk('path',{d,fill:'none',stroke:w.color||'#6b7280','stroke-width':1.8,opacity:0.85},svg);
    if (w.label) {
      const mx=(a.x+b.x)/2;
      mk('rect',{x:mx-14,y:midY-8,width:28,height:11,fill:'#fff',opacity:0.85,rx:2},svg);
      mk('text',{x:mx,y:midY+1,'text-anchor':'middle','font-size':8,fill:'#374151','font-weight':'bold'},svg).textContent=w.label;
    }
  });

  boxes.forEach(({e,x,y,w,h})=>{
    const connected = e.ports.length>0;
    const hasSymbol = !!e.sym;
    const [compId] = e.nodeId.split(':');
    if (hasSymbol) drawSymbol(svg, e.sym, x, y, w, h, e.label, e.compType);
    else drawSymbol(svg, null, x, y, w, h, e.label, e.compType);
    mk('text',{x:x+w/2,y:y+h+14,'text-anchor':'middle','font-size':8,fill:'#94a3b8'},svg)
      .textContent = '#'+compId;
    e.ports.forEach((pi,i)=>{
      const px = x+10+i*PORTGAP+PORTGAP/2-13, py=y;
      mk('circle',{cx:px,cy:py,r:3.5,fill:'#fff',stroke:'#374151','stroke-width':1.5},svg);
      if (!hasSymbol) mk('text',{x:px,y:py-6,'text-anchor':'middle','font-size':7,fill:'#64748b'},svg).textContent=pi;
    });
    if (!connected) {
      mk('text',{x:x+w/2,y:y+h/2+4,'text-anchor':'middle','font-size':7,fill:'#94a3b8'},svg).textContent='(nicht verdrahtet)';
    }
  });
}
</script>
</body>
</html>
